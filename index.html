<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Nosso Sonho | ENB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A; --navy-2:#2C4170; --orange:#E8702A; --orange-d:#B9520F;
  --sky:#D6E4F0; --sky-2:#EEF4F9; --ink:#1F2733; --muted:#5A6270; --line:#C3D0DF;
  --white:#fff; --ok:#1E7A4C;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --head:"Barlow Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--white);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font:700 24px/1 var(--head);letter-spacing:.01em;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.brand small{font:500 14px/1 var(--body);color:var(--sky);opacity:.9}
.team{display:flex;gap:8px;align-items:center;min-width:0}
.top .team select{background:var(--navy-2);color:#fff;border:1px solid #4A5F8F;border-radius:6px;padding:8px 10px;max-width:240px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{white-space:nowrap;border:1px solid transparent;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;background:var(--sky-2);color:var(--navy);min-height:40px}
.btn:hover{background:var(--sky)}
.top .btn{background:transparent;color:#fff;border-color:#4A5F8F}
.top .btn:hover{background:var(--navy-2)}
.top .btn.main{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.top .btn.main:hover{background:var(--orange-d)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{padding:4px 10px;min-height:34px;font-size:14px}
.btn.del{background:transparent;color:var(--muted);border-color:transparent;padding:4px 8px;min-height:34px}
.btn.del:hover{color:#A32B1C;background:#FBECE9}

/* Estrutura */
.shell{max-width:1240px;margin:0 auto;padding:0 16px 80px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px}
nav.steps{position:sticky;top:76px;align-self:start;padding-top:28px}
nav.steps ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--sky)}
nav.steps a{display:block;padding:9px 0 9px 16px;margin-left:-2px;border-left:2px solid transparent;text-decoration:none;color:var(--muted);font-weight:500;line-height:1.25}
nav.steps a:hover{color:var(--navy)}
nav.steps a.on{color:var(--navy);border-left-color:var(--orange);font-weight:600}
nav.steps .meter{display:block;height:3px;width:120px;background:var(--sky);border-radius:2px;margin-top:6px;overflow:hidden}
nav.steps .meter i{display:block;height:100%;background:var(--navy-2);width:0;transition:width .25s}
nav.steps a.done .meter i{background:var(--ok)}
.saved{margin:22px 0 0 16px;font-size:14px;color:var(--muted)}

main{min-width:0}
.hero{padding:40px 0 8px}
.hero h1{font:700 clamp(44px,7vw,76px)/.95 var(--head);color:var(--navy);margin:0 0 10px}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:60ch}
section{padding:36px 0 8px;border-top:1px solid var(--sky);margin-top:36px}
section.first{border-top:0;margin-top:8px;padding-top:20px}
h2{font:600 34px/1.05 var(--head);color:var(--navy);margin:0 0 6px}
h3{font:600 23px/1.15 var(--head);color:var(--navy);margin:34px 0 6px}
.lead{color:var(--muted);margin:0 0 14px;max-width:72ch}
.cap{font-weight:600;color:var(--navy);margin:22px 0 8px;font-size:15px}
.q{font-weight:500;color:var(--navy);margin:20px 0 6px;display:block;max-width:76ch}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}

/* Campos */
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:9px 11px;min-height:42px}
textarea,input,select{color:var(--ink)}
textarea{resize:none;overflow:hidden;display:block;line-height:1.45}
textarea.box{min-height:104px;border-left:4px solid var(--orange)}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2)}
.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.ident label,.field label{display:block;font-size:14px;font-weight:500;color:var(--navy);margin-bottom:4px}

/* Quadros */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid var(--line);padding:6px;vertical-align:middle;text-align:left}
thead th{background:var(--navy);color:#fff;font-weight:600;font-size:14px;padding:9px 8px;border-color:var(--navy)}
tbody th{background:var(--sky-2);color:var(--navy);font-weight:600;font-size:15px;padding:9px 10px}
td input,td textarea,td select{border-color:transparent;background:transparent;padding:7px 6px;min-height:38px}
td input:hover,td textarea:hover,td select:hover{border-color:var(--line)}
td.x{width:44px;text-align:center;padding:2px;border-left-color:transparent}
th.x{width:44px}
td.ro{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.rowbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* O sonho */
.dream{background:var(--navy);color:#fff;border-radius:10px;padding:30px 28px 28px;margin-top:6px}
.dream h2{color:#fff;font-size:46px}
.dream .lead{color:var(--sky)}
.dream textarea.box{min-height:170px;font-size:18px;border:0;border-left:5px solid var(--orange)}
.start{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0 20px;padding:16px 18px;background:var(--navy-2);border-radius:8px}
.start h4{margin:0 0 6px;font:600 17px/1.2 var(--head);color:var(--sky)}
.start ul{margin:0;padding-left:18px}
.start li{margin:2px 0}
.start p{margin:0;color:var(--sky);grid-column:1/-1}

.pc{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;box-shadow:0 6px 24px rgba(27,42,74,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
.toast.show{opacity:1}
.warn{background:#FFF3E8;border:1px solid var(--orange);border-radius:6px;padding:10px 14px;margin-top:16px}
footer{margin-top:50px;font-size:14px;color:var(--muted)}

@media (max-width:1400px){.brand small{display:none}}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  html{scroll-padding-top:130px}
  .brand small{display:none}
  nav.steps{top:0;position:static;padding-top:0;margin:0 -16px}
  nav.steps ol{display:flex;overflow-x:auto;border-left:0;border-bottom:1px solid var(--sky);padding:0 8px}
  nav.steps a{padding:12px 10px;margin:0;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  nav.steps a.on{border-left:0;border-bottom-color:var(--orange)}
  nav.steps .meter{width:100%}
  .saved{margin:10px 16px 0}
}
@media (max-width:680px){
  .top{position:static}
  html{scroll-padding-top:12px}
  .team{width:100%}.team select{max-width:none;flex:1}
  .actions{width:100%}.actions .btn{flex:1 1 auto;padding:8px 10px}
  .dream{margin-left:-16px;margin-right:-16px;border-radius:0;padding:26px 16px}
  .start{grid-template-columns:1fr}
  /* quadros passam a fichas */
  table.stack,table.stack tbody,table.stack tr,table.stack td,table.stack tbody th{display:block;width:auto}
  table.stack thead{display:none}
  table.stack tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
  table.stack td,table.stack tbody th{border:0;border-bottom:1px solid var(--sky)}
  table.stack tr>*:last-child{border-bottom:0}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:13px;font-weight:600;color:var(--navy);padding:2px 6px 0}
  table.stack td.x{width:auto;text-align:right}
  table.stack td.ro{text-align:left;padding-left:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
  @page{size:A4;margin:16mm 14mm}
  body{font-size:11pt}
  .top,nav.steps,.rowbar,.x,.toast,.no-print,.saved{display:none!important}
  .shell{display:block;padding:0;max-width:none}
  .hero{padding-top:0}.hero h1{font-size:40pt}
  section{margin-top:18pt;padding-top:14pt}
  h2,h3,.cap,.q{break-after:avoid}
  tr,.field{break-inside:avoid}
  input,select,textarea{border-color:#9AA9BD!important}
  td input,td textarea,td select{border-color:transparent!important}
  select{appearance:none;-webkit-appearance:none}
  thead th,tbody th,.dream,.start{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  ::placeholder{color:transparent}
  textarea,input[type=date]{display:none!important}
  .pc{display:block;white-space:pre-wrap;overflow-wrap:anywhere;padding:5pt 6pt;min-height:22pt;color:#1F2733;background:#fff}
  .pc.box{border:1px solid #9AA9BD;border-left:4px solid var(--orange);border-radius:4px;min-height:64pt}
  .ident .pc{border:1px solid #9AA9BD;border-radius:4px}
  footer{margin-top:20pt}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">O Nosso Sonho <small>Escola Nacional de Basquetebol</small></div>
    <div class="team">
      <label for="teamSel" class="sr" style="position:absolute;left:-9999px">Equipa</label>
      <select id="teamSel" title="Equipa em edição"></select>
      <button class="btn" id="bNew" type="button">Nova equipa</button>
    </div>
    <div class="actions">
      <button class="btn" id="bExport" type="button">Exportar dados</button>
      <button class="btn" id="bImport" type="button">Importar cópia</button>
      <button class="btn main" id="bPrint" type="button">Imprimir / PDF</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="steps" aria-label="Secções">
    <ol id="nav"></ol>
    <p class="saved" id="saved" aria-live="polite"></p>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var KEY='enb-nosso-sonho-v1', APP='enb-nosso-sonho';

/* ---------- Modelo ---------- */
var Q1=[['faixa','Escalão / faixa etária'],['anos','Anos de nascimento'],['total','Número total de atletas'],['mf','Número de atletas masculinos / femininos'],['tempo','Tempo médio de prática (anos)'],['primeiro','Atletas no primeiro ano de prática']];
var Q2=[['a','< 1 ano'],['b','1–2 anos'],['c','3–4 anos'],['d','≥ 5 anos']];
var Q3=[['treinos','Número de treinos por semana'],['duracao','Duração de cada treino'],['espaco','Espaço de treino (campo inteiro / meio campo / partilhado)'],['tabelas','Número de tabelas disponíveis'],['bolas','Número de bolas (e tamanho)'],['material','Material de apoio (cones, sinalizadores, coletes, outros)'],['adjuntos','Treinadores adjuntos / apoio técnico'],['competicao','Competição (quadro competitivo, n.º de jogos)']];
var FIS=[['Altura','cm'],['Peso','kg'],['Envergadura','cm'],['Salto horizontal a pés juntos','m'],['20 m em corrida','s'],['20 m em drible','s']];
var DIM=['Técnica','Tática','Física','Individual (jogador)','Coletiva (equipa)','Ambiente de treino'];
var CLASSES=['Ponto forte','A melhorar'];
var ESTADOS=['Por iniciar','Em curso','Alcançado'];
var ESTADOS_R=['Por fazer','Feita'];
var ROWS={tec:function(){return{teste:'',criterio:'',media:'',melhor:'',pior:''}},
          sint:function(){return{forte:'',prior:''}},
          reav:function(){return{data:'',foco:'',estado:''}}};
var SECTIONS=[['s0','Identificação'],['s1','1. Caracterização da equipa'],['s2','2. A realidade atual'],['s3','3. O nosso sonho'],['s4','4. Justificação'],['s5','5. Conclusões']];

function blank(){
  var d={id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),atualizado:'',
    ident:{treinador:'',clube:'',escalao:'',epoca:'',data:''},
    q1:{},q2:{a:'',b:'',c:'',d:''},obsCar:'',q3:{},implic:'',
    tec:[],tecAn:{fortes:'',carenc:'',difs:''},
    fis:[],fisAn:{destaca:'',prior:'',relacao:''},
    sint:[],sonho:'',obj:[],
    just:{adequados:'',prioridades:'',estrategias:'',acompanhamento:''},
    reav:[],concl:''};
  Q1.forEach(function(r){d.q1[r[0]]=''});Q3.forEach(function(r){d.q3[r[0]]=''});
  for(var i=0;i<6;i++)d.tec.push(ROWS.tec());
  FIS.forEach(function(){d.fis.push({media:'',perc:'',classe:''})});
  for(i=0;i<4;i++)d.sint.push(ROWS.sint());
  DIM.forEach(function(){d.obj.push({objetivo:'',indicador:'',estado:''})});
  for(i=0;i<3;i++)d.reav.push(ROWS.reav());
  return d;
}
/* garante que um documento importado tem todos os campos */
function normalize(src){
  var b=blank();
  (function merge(t,s){
    Object.keys(t).forEach(function(k){
      if(s==null||s[k]==null)return;
      if(Array.isArray(t[k])){
        if(!Array.isArray(s[k]))return;
        var fixed=(k==='fis'||k==='obj'), tpl=t[k][0]||{};
        var n=fixed?t[k].length:Math.max(s[k].length,1), out=[];
        for(var i=0;i<n;i++){var o=JSON.parse(JSON.stringify(tpl));for(var f in o)o[f]='';merge(o,s[k][i]||{});out.push(o)}
        t[k]=out;
      }else if(typeof t[k]==='object'){merge(t[k],s[k])}
      else{t[k]=String(s[k])}
    });
  })(b,src||{});
  return b;
}

var store={docs:{},current:''}, storageOK=true, doc;
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.docs){Object.keys(p.docs).forEach(function(id){store.docs[id]=normalize(p.docs[id])});store.current=p.current}}}
  catch(e){storageOK=false}
  if(!Object.keys(store.docs).length){var d=blank();store.docs[d.id]=d;store.current=d.id}
  if(!store.docs[store.current])store.current=Object.keys(store.docs)[0];
  doc=store.docs[store.current];
}
var tmr;
function save(now){
  clearTimeout(tmr);
  tmr=setTimeout(function(){
    doc.atualizado=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(store));storageOK=true;
      $('saved').textContent='Guardado neste navegador às '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});}
    catch(e){storageOK=false;$('saved').textContent='Não foi possível guardar neste navegador. Exporte os dados para não os perder.'}
  },now?0:400);
}

/* ---------- Utilitários ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function get(path){return path.split('.').reduce(function(o,k){return o==null?undefined:o[k]},doc)}
function set(path,v){var p=path.split('.'),o=doc;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v}
function ta(k,label,cls,ph){return '<textarea data-k="'+k+'" rows="1" aria-label="'+esc(label)+'"'+(cls?' class="'+cls+'"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(get(k))+'</textarea>'}
function sel(k,label,opts){var v=get(k);return '<select data-k="'+k+'" aria-label="'+esc(label)+'"><option value=""></option>'+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function box(k,q,cls){return '<div class="field"><label class="q" for="f_'+k+'">'+q+'</label><textarea id="f_'+k+'" data-k="'+k+'" rows="3" class="box '+(cls||'')+'">'+esc(get(k))+'</textarea></div>'}
function delBtn(list,i){return '<td class="x"><button type="button" class="btn del" data-del="'+list+'.'+i+'" title="Remover linha" aria-label="Remover linha">✕</button></td>'}
function teamName(d){var n=[d.ident.clube,d.ident.escalao].filter(Boolean).join(' · ');return n||'Equipa sem nome'}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},3200)}

/* ---------- Desenho ---------- */
function render(){
  var h='';
  h+='<div class="hero"><h1>O Nosso Sonho</h1><p>Avaliação inicial da equipa e definição do percurso formativo: de onde partimos, onde queremos chegar e como lá chegamos.</p>'+
     (storageOK?'':'<p class="warn">Este navegador não permite guardar dados localmente (modo privado ou armazenamento bloqueado). Use “Exportar dados” antes de fechar a página.</p>')+'</div>';

  /* Identificação */
  h+='<section id="s0" class="first"><h2>Identificação</h2><div class="ident">'+
    [['treinador','Treinador(a)'],['clube','Clube / Equipa'],['escalao','Escalão'],['epoca','Época desportiva']].map(function(f){
      return '<div><label for="i_'+f[0]+'">'+f[1]+'</label><input type="text" id="i_'+f[0]+'" data-k="ident.'+f[0]+'" value="'+esc(doc.ident[f[0]])+'"></div>'}).join('')+
    '<div><label for="i_data">Data</label><input type="date" id="i_data" data-k="ident.data" value="'+esc(doc.ident.data)+'"></div></div></section>';

  /* 1 */
  h+='<section id="s1"><h2>1. Caracterização da equipa</h2>'+
    '<h3>1.1 Faixa etária, número de atletas e tempo de prática</h3>'+
    '<p class="cap">Quadro 1 – Caracterização geral da equipa</p><table><thead><tr><th style="width:44%">Indicador</th><th>Registo</th></tr></thead><tbody>'+
    Q1.map(function(r){return '<tr><th scope="row">'+r[1]+'</th><td>'+ta('q1.'+r[0],r[1])+'</td></tr>'}).join('')+'</tbody></table>'+
    '<p class="cap">Quadro 2 – Distribuição dos atletas por tempo de prática</p><table><thead><tr><th style="width:26%">Tempo de prática</th>'+Q2.map(function(c){return '<th>'+esc(c[1])+'</th>'}).join('')+'</tr></thead><tbody>'+
    '<tr><th scope="row">N.º de atletas</th>'+Q2.map(function(c){return '<td><input type="text" inputmode="numeric" data-k="q2.'+c[0]+'" aria-label="N.º de atletas '+esc(c[1])+'" value="'+esc(doc.q2[c[0]])+'" style="text-align:center"></td>'}).join('')+'</tr>'+
    '<tr><th scope="row">% da equipa</th>'+Q2.map(function(c){return '<td class="ro" id="pc_'+c[0]+'"></td>'}).join('')+'</tr></tbody></table>'+
    '<p class="hint no-print">A percentagem é calculada a partir do número de atletas em cada coluna.</p>'+
    box('obsCar','Observações sobre a caracterização (heterogeneidade do grupo, experiência prévia, assiduidade, outros aspetos relevantes)')+
    '<h3>1.2 Condições de prática</h3><p class="cap">Quadro 3 – Condições de prática</p><table><thead><tr><th style="width:44%">Condição</th><th>Descrição</th></tr></thead><tbody>'+
    Q3.map(function(r){return '<tr><th scope="row">'+r[1]+'</th><td>'+ta('q3.'+r[0],r[1])+'</td></tr>'}).join('')+'</tbody></table>'+
    box('implic','Que implicações têm estas condições no planeamento e na organização do treino?')+'</section>';

  /* 2 */
  h+='<section id="s2"><h2>2. A realidade atual</h2><p class="lead">Resultados da avaliação inicial, que definem o ponto de partida da equipa.</p>'+
    '<h3>2.1 Avaliação técnica</h3><p class="cap">Quadro 4 – Resultados da avaliação técnica</p>'+
    '<table class="stack"><thead><tr><th style="width:26%">Teste / conteúdo técnico</th><th style="width:22%">Critério de medição</th><th>Média da equipa</th><th>Melhor resultado</th><th>Pior resultado</th><th class="x"></th></tr></thead><tbody>'+
    doc.tec.map(function(r,i){var p='tec.'+i+'.';return '<tr><td data-l="Teste / conteúdo técnico">'+ta(p+'teste','Teste')+'</td><td data-l="Critério de medição">'+ta(p+'criterio','Critério de medição')+'</td><td data-l="Média da equipa">'+ta(p+'media','Média da equipa')+'</td><td data-l="Melhor resultado">'+ta(p+'melhor','Melhor resultado')+'</td><td data-l="Pior resultado">'+ta(p+'pior','Pior resultado')+'</td>'+delBtn('tec',i)+'</tr>'}).join('')+
    '</tbody></table><div class="rowbar"><button type="button" class="btn small ghost" data-add="tec">Adicionar teste</button></div>'+
    '<p class="q" style="margin-top:26px">Análise dos resultados técnicos</p>'+
    box('tecAn.fortes','Pontos fortes da equipa')+box('tecAn.carenc','Áreas mais carenciadas')+box('tecAn.difs','Diferenças individuais relevantes')+
    '<h3>2.2 Avaliação física</h3><p class="lead">Os resultados individuais são comparados com os valores de referência por idade (Matulaitis, 2013; Matulaitis et al., 2019), apresentados no documento de apoio Testes Físicos.</p>'+
    '<p class="cap">Quadro 5 – Resultados da avaliação física</p>'+
    '<table class="stack"><thead><tr><th style="width:28%">Teste</th><th style="width:10%">Unidade</th><th>Média da equipa</th><th>Percentil de referência</th><th style="width:24%">Classificação</th></tr></thead><tbody>'+
    FIS.map(function(f,i){var p='fis.'+i+'.';return '<tr><th scope="row">'+f[0]+'</th><td class="ro" data-l="Unidade">'+f[1]+'</td><td data-l="Média da equipa">'+ta(p+'media','Média da equipa, '+f[0])+'</td><td data-l="Percentil de referência">'+ta(p+'perc','Percentil de referência, '+f[0])+'</td><td data-l="Classificação">'+sel(p+'classe','Classificação, '+f[0],CLASSES)+'</td></tr>'}).join('')+
    '</tbody></table>'+
    '<p class="q" style="margin-top:26px">Análise dos resultados físicos</p>'+
    box('fisAn.destaca','Capacidades em que a equipa se destaca')+box('fisAn.prior','Capacidades prioritárias para intervenção')+box('fisAn.relacao','Relação entre os resultados físicos e técnicos (ex.: 20 m em corrida vs. 20 m em drible)')+
    '<h3>2.3 Síntese do ponto de partida</h3><p class="cap">Quadro 6 – Pontos fortes e áreas prioritárias</p>'+
    '<table class="stack"><thead><tr><th>Pontos fortes</th><th>Áreas prioritárias para intervenção</th><th class="x"></th></tr></thead><tbody>'+
    doc.sint.map(function(r,i){return '<tr><td data-l="Ponto forte">'+ta('sint.'+i+'.forte','Ponto forte')+'</td><td data-l="Área prioritária">'+ta('sint.'+i+'.prior','Área prioritária')+'</td>'+delBtn('sint',i)+'</tr>'}).join('')+
    '</tbody></table><div class="rowbar"><button type="button" class="btn small ghost" data-add="sint">Adicionar linha</button><button type="button" class="btn small ghost" id="bSug">Trazer classificações da avaliação física</button></div></section>';

  /* 3 */
  h+='<section id="s3" style="border-top:0"><div class="dream"><h2>3. O nosso sonho</h2>'+
    '<p class="lead">Onde queremos chegar, com esta equipa e com cada jogador, no final do percurso.</p>'+
    '<div class="start no-print" id="start"></div>'+
    '<textarea data-k="sonho" rows="5" class="box" aria-label="O nosso sonho" placeholder="Descreva o sonho da equipa técnica…">'+esc(doc.sonho)+'</textarea></div>'+
    '<p class="cap">Quadro 7 – Objetivos do percurso formativo</p>'+
    '<table class="stack"><thead><tr><th style="width:20%">Dimensão</th><th>Objetivo</th><th>Indicador de sucesso</th><th style="width:16%">Estado</th></tr></thead><tbody>'+
    DIM.map(function(d,i){var p='obj.'+i+'.';return '<tr><th scope="row">'+d+'</th><td data-l="Objetivo">'+ta(p+'objetivo','Objetivo, '+d)+'</td><td data-l="Indicador de sucesso">'+ta(p+'indicador','Indicador de sucesso, '+d)+'</td><td data-l="Estado">'+sel(p+'estado','Estado, '+d,ESTADOS)+'</td></tr>'}).join('')+
    '</tbody></table><p class="hint no-print">O estado serve para acompanhar cada objetivo ao longo da época.</p></section>';

  /* 4 */
  h+='<section id="s4"><h2>4. Justificação para alcançar o nosso sonho</h2><p class="lead">Fundamente as opções tomadas a partir da avaliação inicial.</p>'+
    box('just.adequados','Porque é que estes objetivos são adequados a esta equipa e a esta faixa etária?')+
    box('just.prioridades','Que prioridades resultam dos dados recolhidos?')+
    box('just.estrategias','Que estratégias, meios e métodos de treino vão ser utilizados?')+
    box('just.acompanhamento','Como será acompanhada a evolução (momentos de reavaliação)?')+
    '<p class="cap">Momentos de reavaliação</p><table class="stack"><thead><tr><th style="width:22%">Data</th><th>O que reavaliar</th><th style="width:18%">Estado</th><th class="x"></th></tr></thead><tbody>'+
    doc.reav.map(function(r,i){var p='reav.'+i+'.';return '<tr><td data-l="Data"><input type="date" data-k="'+p+'data" aria-label="Data da reavaliação" value="'+esc(r.data)+'"></td><td data-l="O que reavaliar">'+ta(p+'foco','O que reavaliar')+'</td><td data-l="Estado">'+sel(p+'estado','Estado da reavaliação',ESTADOS_R)+'</td>'+delBtn('reav',i)+'</tr>'}).join('')+
    '</tbody></table><div class="rowbar"><button type="button" class="btn small ghost" data-add="reav">Adicionar momento</button></div></section>';

  /* 5 */
  h+='<section id="s5"><h2>5. Conclusões</h2>'+
    box('concl','Síntese final: ponto de partida, caminho definido e compromisso da equipa técnica com o desenvolvimento dos jogadores.')+
    '<div class="rowbar no-print" style="margin-top:28px"><button type="button" class="btn ghost" id="bDel">Apagar esta equipa</button></div>'+
    '<footer>Escola Nacional de Basquetebol · Formação de Treinadores. Os dados ficam guardados apenas neste navegador.</footer></section>';

  $('main').innerHTML=h;
  $('nav').innerHTML=SECTIONS.map(function(s){return '<li><a href="#'+s[0]+'" data-s="'+s[0]+'">'+s[1]+'<span class="meter"><i></i></span></a></li>'}).join('');
  renderTeams();derived();growAll();spy();
}
function renderTeams(){
  $('teamSel').innerHTML=Object.keys(store.docs).map(function(id){return '<option value="'+id+'"'+(id===store.current?' selected':'')+'>'+esc(teamName(store.docs[id]))+'</option>'}).join('');
}
function derived(){
  /* percentagens do Quadro 2 */
  var n=Q2.map(function(c){var v=parseFloat(String(doc.q2[c[0]]).replace(',','.'));return isFinite(v)&&v>0?v:0}), tot=n.reduce(function(a,b){return a+b},0);
  Q2.forEach(function(c,i){$('pc_'+c[0]).textContent=tot?(Math.round(n[i]/tot*1000)/10).toLocaleString('pt-PT')+' %':''});
  /* ponto de partida junto ao sonho */
  var f=doc.sint.map(function(r){return r.forte.trim()}).filter(Boolean), p=doc.sint.map(function(r){return r.prior.trim()}).filter(Boolean);
  var li=function(a){return a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<ul><li>Por preencher</li></ul>'};
  $('start').innerHTML=(f.length||p.length)?'<div><h4>Pontos fortes</h4>'+li(f)+'</div><div><h4>Áreas prioritárias</h4>'+li(p)+'</div>'
    :'<p>Preencha a síntese do ponto de partida (2.3) para a ter à vista enquanto escreve o sonho.</p>';
  /* progresso por secção */
  SECTIONS.forEach(function(s){
    var els=$(s[0]).querySelectorAll('[data-k]'),done=0;
    for(var i=0;i<els.length;i++)if(els[i].value.trim())done++;
    var a=document.querySelector('nav a[data-s="'+s[0]+'"]'),pct=els.length?Math.round(done/els.length*100):0;
    a.querySelector('i').style.width=pct+'%';a.classList.toggle('done',pct===100);
    a.title=done+' de '+els.length+' campos preenchidos';
  });
}
function fmtDate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);return m?m[3]+'/'+m[2]+'/'+m[1]:v}
function printPrep(){
  printClean();
  var a=document.querySelectorAll('textarea,input[type=date]');
  for(var i=0;i<a.length;i++){var d=document.createElement('div');d.className='pc'+(a[i].classList.contains('box')?' box':'');
    d.textContent=a[i].type==='date'?fmtDate(a[i].value):a[i].value;a[i].parentNode.insertBefore(d,a[i].nextSibling)}
}
function printClean(){var a=document.querySelectorAll('.pc');for(var i=0;i<a.length;i++)a[i].remove()}
function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
function growAll(){var a=document.querySelectorAll('textarea');for(var i=0;i<a.length;i++)grow(a[i])}

/* ---------- Eventos ---------- */
var main=$('main');
main.addEventListener('input',function(e){
  var k=e.target.getAttribute('data-k');if(!k)return;
  set(k,e.target.value);if(e.target.tagName==='TEXTAREA')grow(e.target);
  if(k.indexOf('ident.')===0)renderTeams();
  derived();save();
});
main.addEventListener('change',function(e){if(e.target.getAttribute('data-k')){set(e.target.getAttribute('data-k'),e.target.value);derived();save()}});
main.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var add=b.getAttribute('data-add'),del=b.getAttribute('data-del');
  if(add){doc[add].push(ROWS[add]());save();render();var rows=document.querySelectorAll('[data-k^="'+add+'.'+(doc[add].length-1)+'."]');if(rows[0])rows[0].focus();return}
  if(del){var p=del.split('.'),list=doc[p[0]],row=list[+p[1]];
    var filled=Object.keys(row).some(function(f){return row[f].trim()});
    if(filled&&!confirm('Remover esta linha? O conteúdo será apagado.'))return;
    list.splice(+p[1],1);if(!list.length)list.push(ROWS[p[0]]());save();render();return}
  if(b.id==='bSug')suggest();
  if(b.id==='bDel')removeTeam();
});
function suggest(){
  var added=0;
  function put(field,text){
    if(doc.sint.some(function(r){return r[field].trim().toLowerCase()===text.toLowerCase()}))return;
    var r=doc.sint.filter(function(x){return !x[field].trim()})[0];
    if(!r){r=ROWS.sint();doc.sint.push(r)}
    r[field]=text;added++;
  }
  doc.fis.forEach(function(r,i){if(r.classe==='Ponto forte')put('forte',FIS[i][0]);if(r.classe==='A melhorar')put('prior',FIS[i][0])});
  if(!added){toast(doc.fis.some(function(r){return r.classe})?'A síntese já inclui os testes classificados.':'Classifique primeiro os testes no Quadro 5.');return}
  save();render();location.hash='';$('s2').querySelector('#bSug').scrollIntoView({block:'center'});
  toast(added+(added===1?' item acrescentado':' itens acrescentados')+' à síntese.');
}
function removeTeam(){
  if(!confirm('Apagar “'+teamName(doc)+'” e todo o seu conteúdo? Esta ação não pode ser anulada.'))return;
  delete store.docs[doc.id];
  var ids=Object.keys(store.docs);
  if(!ids.length){var d=blank();store.docs[d.id]=d;ids=[d.id]}
  store.current=ids[0];doc=store.docs[store.current];save(true);render();window.scrollTo(0,0);toast('Equipa apagada.');
}
$('teamSel').addEventListener('change',function(e){store.current=e.target.value;doc=store.docs[store.current];save(true);render();window.scrollTo(0,0)});
$('bNew').addEventListener('click',function(){var d=blank();store.docs[d.id]=d;store.current=d.id;doc=d;save(true);render();window.scrollTo(0,0);$('i_treinador').focus();toast('Nova equipa criada.')});
$('bPrint').addEventListener('click',function(){printPrep();window.print()});
window.addEventListener('beforeprint',printPrep);
window.addEventListener('afterprint',function(){printClean();growAll()});
window.addEventListener('resize',growAll);

/* Exportar */
$('bExport').addEventListener('click',function(){
  var data={app:APP,versao:1,exportado:new Date().toISOString(),current:store.current,docs:store.docs};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='o-nosso-sonho_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  var n=Object.keys(store.docs).length;toast('Exportado: '+n+(n===1?' equipa.':' equipas.'));
});
/* Importar */
$('bImport').addEventListener('click',function(){$('file').value='';$('file').click()});
$('file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var p;try{p=JSON.parse(r.result)}catch(err){alert('O ficheiro não é uma cópia de segurança válida (não foi possível lê-lo como JSON).');return}
    if(!p||p.app!==APP||!p.docs||typeof p.docs!=='object'){alert('Este ficheiro não foi exportado por esta aplicação.');return}
    var ids=Object.keys(p.docs);if(!ids.length){alert('A cópia de segurança não contém equipas.');return}
    var over=ids.filter(function(id){return store.docs[id]}).length;
    var msg='Importar '+ids.length+(ids.length===1?' equipa':' equipas')+'?';
    if(over)msg+='\n\n'+over+(over===1?' equipa já existe neste navegador e será substituída':' equipas já existem neste navegador e serão substituídas')+' pela versão da cópia.';
    if(!confirm(msg))return;
    /* remove a equipa vazia inicial, se for a única */
    var cur=Object.keys(store.docs);
    if(cur.length===1&&JSON.stringify(normalize(store.docs[cur[0]]),skipMeta)===JSON.stringify(blank(),skipMeta))delete store.docs[cur[0]];
    ids.forEach(function(id){var d=normalize(p.docs[id]);d.id=id;d.atualizado=p.docs[id].atualizado||'';store.docs[id]=d});
    store.current=p.docs[p.current]?p.current:ids[0];doc=store.docs[store.current];
    save(true);render();window.scrollTo(0,0);toast('Cópia de segurança importada.');
  };
  r.readAsText(f);
});
function skipMeta(k,v){return (k==='id'||k==='atualizado')?undefined:v}

/* destaque da secção visível */
function spy(){
  var on=SECTIONS[0][0],lim=window.innerHeight*0.35;
  SECTIONS.forEach(function(x){var el=$(x[0]);if(el&&el.getBoundingClientRect().top<=lim)on=x[0]});
  var l=document.querySelectorAll('nav a');for(var i=0;i<l.length;i++)l[i].classList.toggle('on',l[i].getAttribute('data-s')===on);
}
window.addEventListener('scroll',spy,{passive:true});

load();render();spy();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(growAll);
})();
</script>
</body>
</html>
